# Real-provider tests. Separate from ci.yml's `check` job, which stays offline.
#
# pull_request is intentionally absent. A pull_request run from a fork would
# otherwise be the path that can see repository secrets. Same-repo pull
# requests are not a trigger either; dispatch this workflow to try a branch
# after it is on the default branch's workflow list.
#
# The daily cron is live-daily.yml. It runs only jev and clef. Steps for every
# backend live in live-backend.yml.
name: Live

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to run
        type: choice
        default: all
        options:
          - all
          - jev
          - clef
          - openai
          - openrouter
          - vercel

permissions:
  contents: read

concurrency:
  group: live-backends
  cancel-in-progress: false

jobs:
  jev:
    name: live @askif/jev
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.backend == 'all' || github.event.inputs.backend == 'jev'
    uses: ./.github/workflows/live-backend.yml
    with:
      backend: jev
      name: live @askif/jev
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  clef:
    name: live @askif/clef
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.backend == 'all' || github.event.inputs.backend == 'clef'
    uses: ./.github/workflows/live-backend.yml
    with:
      backend: clef
      name: live @askif/clef
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  openai:
    name: live @askif/openai
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.backend == 'all' || github.event.inputs.backend == 'openai'
    uses: ./.github/workflows/live-backend.yml
    with:
      backend: openai
      name: live @askif/openai
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  openrouter:
    name: live OpenRouter (Jev)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.backend == 'all' || github.event.inputs.backend == 'openrouter'
    uses: ./.github/workflows/live-backend.yml
    with:
      backend: openrouter
      name: live OpenRouter (Jev)
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  vercel:
    name: live @askif/vercel
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.backend == 'all' || github.event.inputs.backend == 'vercel'
    uses: ./.github/workflows/live-backend.yml
    with:
      backend: vercel
      name: live @askif/vercel
    secrets:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
