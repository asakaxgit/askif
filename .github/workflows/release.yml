name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: changesets/action opens and updates its own
# "Version Packages" PR using the default GITHUB_TOKEN — no PAT needed.
# id-token: the OIDC identity this workflow presents to npm's trusted
# publishing. There is no NPM_TOKEN/NODE_AUTH_TOKEN anywhere in this file —
# that's the point. See RELEASING.md for the one-time npm-side setup this
# depends on (an npm Trusted Publisher configured for this exact repo and
# workflow filename, for each published package).
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # OIDC trusted publishing is npm's own feature (>=11.5.1), not
      # pnpm's — see .github/scripts/publish.ts's header comment for why
      # this workflow calls `npm publish` directly instead of going through
      # `pnpm publish`/`changeset publish`. The npm bundled with Node 22
      # isn't guaranteed to be new enough, so update it explicitly.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # This action's own logic decides which of the two commands below
      # actually runs:
      # - pending changesets in .changeset/ -> runs `version`, opening/
      #   updating the "Version Packages" PR. Nothing is built or published.
      #   `version-packages` (package.json) runs `changeset version` then
      #   `pnpm install --lockfile-only`, as a script because this action
      #   splits `version:` into arguments and runs no shell. The install is
      #   needed because `changeset version` bumps in-repo dependency ranges (e.g. @askif/jev's
      #   `askif`) in package.json but not in pnpm-lock.yaml, which would fail
      #   CI's `--frozen-lockfile` on the Version Packages PR. It resolves the
      #   new range to the local package (`linkWorkspacePackages`), since that
      #   version isn't on npm yet.
      #   (Both inputs are script names, not `a && b` chains: this action splits
      #   them into arguments and runs no shell.)
      # - no pending changesets (that PR was just merged) -> runs `publish`,
      #   which builds fresh and publishes every package whose version
      #   changed (via .github/scripts/publish.ts, using plain `npm
      #   publish` per package — see that file for why).
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
