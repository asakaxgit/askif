name: Kotlin

on:
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"

jobs:
  jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      - name: Point Gradle at both JDKs
        run: |
          echo "org.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_17_X64" >> gradle.properties
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Test, API check, Dokka
        run: ./gradlew test apiCheck dokkaHtml --stacktrace

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Point Gradle at both JDKs
        working-directory: kotlin
        run: |
          echo "org.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_17_X64" >> gradle.properties
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Install the Kotlin driver
        working-directory: kotlin
        run: ./gradlew :conformance:installDist --stacktrace
      - run: npm ci
        working-directory: spec/runner
      - name: Conformance matrix
        run: node --import tsx spec/runner/src/run.ts
